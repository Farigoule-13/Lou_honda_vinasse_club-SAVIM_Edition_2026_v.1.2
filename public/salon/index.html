<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13294b">
  <link rel="icon" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>LHVC · Salon des vignerons</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="top-back" id="back" aria-label="Retour" hidden>‹</button>
    <h1 id="title"><img src="img/logo.jpg" alt="" class="logo-mini">Vinasse Club · SAVIM</h1>
    <span class="sync-dot" id="syncDot" title="Synchronisation"></span>
  </header>
  <main id="app"><p class="center hint" style="margin-top:3rem">Chargement…</p></main>
  <nav class="tabbar" id="tabbar" hidden>
    <button data-go="home"><span>🏠</span>Accueil</button>
    <button data-go="pick"><span>🥂</span>Je goûte</button>
    <button data-go="scan" class="tab-scan"><span>📷</span>Scanner</button>
    <button data-go="exposants"><span>🗺️</span>Exposants</button>
    <button data-go="mine"><span>📒</span>Mes notes</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>Active JavaScript pour utiliser l'appli.</noscript>
  <script src="vendor/qrcode.js"></script>
  <script src="vendor/sha256.js"></script>
  <script src="data/fiches.js"></script>
  <script src="data/exposants.js"></script>
  <script src="app.js"></script>
</body>
</html>
